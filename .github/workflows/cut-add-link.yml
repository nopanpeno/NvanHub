name: Tambah shortlink NvanCut

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Nama pendek (huruf, angka, - atau _)"
        required: true
        type: string
      url:
        description: "Link tujuan (http:// atau https://)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cut-links
  cancel-in-progress: false

jobs:
  add:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tambah ke links.json
        env:
          LINK_ALIAS: ${{ inputs.alias }}
          LINK_URL: ${{ inputs.url }}
        run: node cut/scripts/links.mjs add

      - name: Cek dan buat halaman link
        run: |
          node cut/scripts/links.mjs check
          node cut/scripts/links.mjs pages

      - name: Commit
        env:
          LINK_ALIAS: ${{ inputs.alias }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cut
          git commit -m "Tambah shortlink /${LINK_ALIAS}"
          git push
