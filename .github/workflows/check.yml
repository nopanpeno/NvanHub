name: Cek

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cek data, syntax JS, dan file yang dirujuk
        run: node scripts/check.mjs
      - name: Tes NvanPass (codec dan protokol transfer)
        run: npm test
        working-directory: pass
      - name: Cek kontrak game NvanPlay
        run: node scripts/check-games.mjs
        working-directory: play
      - name: Cek shortlink NvanCut (links.json, dan halaman alias sudah sesuai)
        run: |
          node cut/scripts/links.mjs check
          node cut/scripts/links.mjs pages
          git diff --exit-code -- cut
      - name: Tes NvanVector (codec dan trace di browser)
        run: |
          npm ci
          npm test
          npm install --no-save playwright
          CI=1 node tools/smoke-halaman.js
        working-directory: vector
      - name: Tes NvanExif (pembersihan metadata, dan ExifTool sebagai pembanding)
        run: |
          npm ci
          npm test
        working-directory: exif
      - name: Tes asap di browser
        run: |
          npm install --no-save playwright
          node scripts/smoke.cjs
